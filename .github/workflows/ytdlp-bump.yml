name: Bump yt-dlp & deno

on:
  workflow_dispatch:

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check latest versions
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # yt-dlp (PyPI)
          LATEST=$(curl -s https://pypi.org/pypi/yt-dlp/json | jq -r .info.version)
          CURRENT=$(grep -oP 'yt-dlp==\K[^\s"]+' requirements.in)
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          if [ "$LATEST" = "$CURRENT" ]; then
            echo "up_to_date=true" >> "$GITHUB_OUTPUT"
          else
            echo "up_to_date=false" >> "$GITHUB_OUTPUT"
          fi
          # deno JS runtime — yt-dlp requires a recent deno for YouTube extraction,
          # so keep its Dockerfile pin in sync with each yt-dlp bump.
          DENO_LATEST=$(curl -s -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/denoland/deno/releases/latest | jq -r .tag_name)
          DENO_LATEST=${DENO_LATEST#v}
          DENO_CURRENT=$(grep -oP 'denoland/deno:bin-\K[^\s]+' Dockerfile)
          echo "deno_latest=$DENO_LATEST" >> "$GITHUB_OUTPUT"
          echo "deno_current=$DENO_CURRENT" >> "$GITHUB_OUTPUT"

      - name: Update version pins and regenerate lockfile
        if: steps.check.outputs.up_to_date == 'false'
        run: |
          sed -i "s/yt-dlp==${{ steps.check.outputs.current }}/yt-dlp==${{ steps.check.outputs.latest }}/" requirements.in
          sed -i "s|denoland/deno:bin-${{ steps.check.outputs.deno_current }}|denoland/deno:bin-${{ steps.check.outputs.deno_latest }}|" Dockerfile
          pip install pip-tools
          pip-compile --generate-hashes requirements.in -o requirements.txt

      - name: Create Pull Request
        if: steps.check.outputs.up_to_date == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b chore/bump-ytdlp
          git add requirements.in requirements.txt Dockerfile
          git commit -m "chore: bump yt-dlp to ${{ steps.check.outputs.latest }} (deno ${{ steps.check.outputs.deno_latest }})"
          git push -f origin chore/bump-ytdlp
          gh pr create \
            --base develop \
            --title "chore: bump yt-dlp to ${{ steps.check.outputs.latest }}" \
            --body "Bumps yt-dlp from \`${{ steps.check.outputs.current }}\` to \`${{ steps.check.outputs.latest }}\`.

          Deno JS runtime (Dockerfile) pinned to \`${{ steps.check.outputs.deno_latest }}\` — required by yt-dlp for YouTube extraction.

          [yt-dlp release notes](https://github.com/yt-dlp/yt-dlp/releases/tag/${{ steps.check.outputs.latest }})"

      - name: Summary
        if: always()
        run: |
          if [ "${{ steps.check.outputs.up_to_date }}" = "true" ]; then
            echo "### yt-dlp is already up to date: \`${{ steps.check.outputs.current }}\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### yt-dlp bumped: \`${{ steps.check.outputs.current }}\` → \`${{ steps.check.outputs.latest }}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "deno pinned: \`${{ steps.check.outputs.deno_current }}\` → \`${{ steps.check.outputs.deno_latest }}\`" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Trigger e2e tests on bump branch
        if: steps.check.outputs.up_to_date == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run e2e-tests.yml --ref chore/bump-ytdlp -f pytest_filter="test_job_reaches_done or test_parallel_downloads_complete"
